<style>

/* ===== BUTTONS ===== */
/* ===== BUTTONS ===== */
.btn{
    display:inline-block; 
    padding:14px 30px;
    border-radius:25px;
    font-weight:600;
    font-size:17px;
    line-height:1.2;
    white-space:nowrap;
    border:2px solid transparent;
    background:#ff6a00;
    color:#fff;
    transition:transform .2s,background .2s,color .2s
}
.btn:hover{transform:translateY(-2px);background:#021a29}
.btn-light{border-color:#fff;background:transparent}
.btn-light:hover{background:#fff;color:#0B1F3A}
.btn-sm{
    background-color: #f7f7f7;
    padding:5px 10px;
    font-size:15px;
    color:black;
    border: 3px solid #ff6a00;
    border-radius: 17px;
}
.btn-sm:hover{
  background-color: #000000;
  color:#ff6a00;
}
/* ===== BUTTONS ===== */
/* ===== BUTTONS ===== */


/* ===== NAV (fixed, transparent at top, solid after scroll) ===== */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:transparent;transition:background .3s,box-shadow .3s}
.nav.scrolled,.nav.menu-open{background:#ff6a00;}
.nav.scrolled{box-shadow:0 3px 14px rgba(0,0,0,.28)}

.nav-inner{max-width:1100px;margin:0 auto;height:65px;padding:0 14px 0 20px;display:flex;align-items:center;gap:10px}
.nav-logo{display:flex;align-items:center;gap:8px;margin-right:auto;font:700 22px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:.5px;color:#fff}
.nav-logo img{height:3.5rem;width:auto}
.nav-logo b{color:#36b4f4}

/* Burger sits on the right (after the Shop button) */
.nav-burger{display:flex;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;padding:10px;background:none;border:0;cursor:pointer}
.nav-burger span{height:3px;background:#ffffff;border-radius:2px;transition:transform .3s,opacity .25s}
.nav-burger.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.nav-burger.open span:nth-child(2){opacity:0}
.nav-burger.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

/* Mobile dropdown menu (unchanged behaviour) */
.nav-menu{position:absolute;top:64px;left:0;right:0;display:flex;flex-direction:column;padding:0 20px;background:#101317;max-height:0;overflow:hidden;visibility:hidden;transition:max-height .35s,padding .35s,visibility 0s linear .35s}
.nav-menu.open{max-height:320px;padding:6px 20px 16px;visibility:visible;transition:max-height .35s,padding .35s,visibility 0s}
.nav-menu a{padding:14px 0;color:#fff;border-bottom:1px solid rgba(255, 119, 0, 0.064);transition:color .2s,padding-left .2s}
.nav-menu a:last-child{border-bottom:0}
.nav-menu a:hover{color:#ff6a00;padding-left:6px}

@media(min-width:960px){
  .nav-inner{gap:28px;padding:0 20px}
  .nav-burger{display:none}
  .nav-logo{font-size:32px;gap:10px}
  .nav-logo img{height:3.5rem; width:auto;}
  .nav-menu{position:static;flex-direction:row;gap:30px;max-height:none;overflow:visible;visibility:visible;padding:0;background:none}
  .nav-menu a{padding:0;border:0}
  .nav-menu a:hover{padding-left:0}
  /* order: logo | menu | Shop */
  .nav-logo{margin-right:0}
  .nav-menu{margin-left:auto}
}

/* ===== HERO ===== */
.hero{position:relative;min-height:60svh;
    display:flex;align-items:center;
    padding:100px 20px 60px;
    color:#fff;
  background:linear-gradient(rgba(11,31,58,.55),rgba(11,31,58,.75)),url('keibg.webp') center/cover no-repeat #99a6b8ab
}
.hero-inner{max-width:1100px;margin:0 auto;width:100%;text-align:center}
.hero h1{margin:0 auto;font-size:clamp(2px,8vw,54px);color:#fff;text-wrap:balance}
.hero p{max-width:46ch;margin:18px auto 30px;font-size:19px;color:#e6edf5}
.hero-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
